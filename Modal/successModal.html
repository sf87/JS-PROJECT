<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Success Modal</title>
    <link rel="stylesheet" href="successModal.css">
    <!---Font Awesome link-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

    <script src="successModal.js" defer></script>   
</head>
<body>
    <div class = "click-container">
        <button class = "clickBtn">Click Here</button>
    </div>

    <div class = "modalContainer">

        <div class = "icon">
            <i class = "fa-solid fa-check"></i>
        </div>

         <div class = "successTitle">
           <!--<h2 class="modalTitle">Success!</h2>-->
               Success!
        </div>

       <div class = "description">
         <p class="message">Your Invitation has been successfully sent.</p>    
        </div>

        <div class = "close-container">
           <button class = "closeBtn">Close</button>
        </div>


    </div>

</body>
